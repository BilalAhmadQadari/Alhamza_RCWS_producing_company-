<body>

<div class="header-container">
        <div class="logo-and-name">
        <img src="./asset/logo.png" alt="alhamza company name" class="logo">

        </div>

        </ul>

<main style="flex: 1;">

<div class="form-container" >
  <form onsubmit="return validate()">

    <input type="text" id="name" placeholder="نوم">

    <input type="text" list="province" placeholder="ولایت">
    <datalist id="province">
      <option value="">ولایت</option>
      <option>کندهار</option>
      <option>کابل</option>
      <option>هرات</option>
      <option>هلمند</option>
    </datalist>

    <input type="number" id="age" placeholder="عمر">

    <div class="gender">
      <label><input type="checkbox" id="male"> نارینه</label>
      <label><input type="checkbox" id="female"> ښځینه</label>
    </div>

    <input type="email" id="email" autocomplete="off" placeholder="بریښنالیک">

    <input type="password" id="password" autocomplete="off" placeholder="رمز">

    <button>لیږل</button>

  </form>
  </div>
</main>
<!-- footer section -->


<footer class="main-footer">

    </div>
  </footer>

</body>
<script>

function validate(){

  let name = document.getElementById("name").value;
  let province = document.getElementById("province").value;
  let age = document.getElementById("age").value;
  let male = document.getElementById("male").checked;
  let female = document.getElementById("female").checked;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  
  console.group();
  console.log("Name: ",name," Age: ", age," Male: ",male," Email: ",email," Password: ",password," Female: ",female);
  console.groupEnd();

  const afghanistanProvinces = [
  "کابل",
  "کندهار",
  "هرات",
  "بلخ",
  "ننګرهار",
  "کندز",
  "بغلان",
  "بدخشان",
  "تخار",  "سمنگان", "جوزجان",  "فارياب",  "سرپل",
    "بامیان",  "دایکندی",  "غزني",  "پکتیا",  "پکتیکا",  "خوست",  "لوګر",  "وردک",
  "پروان",  "کاپیسا",  "پنجشیر",  "لغمان",  "کنړ",  "نورستان",  "هلمند",
  "زابل", "ارزگان",  "فراه",  "بادغیس",  "غور",  "نیمروز"
];

  

  if(name == ""){
    alert("Enter name");
    return false;
  }
  // if(name.length<3){
  //   alert("Invalid name!")\
  //   return false;
  // }

  if(province == ""){
    alert("Select province");
    return false;
  }
  // if(!afghanistanProvinces.includes(province.trim().normalize())){
  //   alert("Invlid province name");
  //   return false;
  // }

  if(age < 1){
    alert("Enter valid age");
    return false;
  }

  if(!male && !female){
    alert("Select gender");
    return false;
  }

  if(!email.includes("@")){
    alert("Enter valid email");
    return false;
  }

  if(password.length < 8){
    alert("Password must be 8 characters");
    return false;
  }

  alert("Form Submitted");
  return true;
}

</script>
<script src="./script.js"></script>
